# Boulder Black Line - Netlify configuration
# Audit bundle 2026-11-23: M1 pretty-URL redirects, M3 security headers,
# M4 long-lived caching for static assets, H1 backup X-Robots-Tag for /owner.
# No full Content-Security-Policy in this bundle (frame-ancestors line only).

# --- M1: .html URLs redirect to the canonical pretty URLs ---
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/coverage.html"
  to = "/coverage"
  status = 301
  force = true

[[redirects]]
  from = "/owner.html"
  to = "/owner"
  status = 301
  force = true

# --- M3: security headers on everything ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# --- H1 backup: keep the owner page out of search indexes ---
[[headers]]
  for = "/owner.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/owner"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# --- M4: immutable long-lived caching for static assets ---
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bbl-fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
